name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore dotnet/Chartis.Pdf.Service/Chartis.Pdf.Service.sln
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: dotnet build dotnet/Chartis.Pdf.Service/Chartis.Pdf.Service.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test dotnet/Chartis.Pdf.Service/Chartis.Pdf.Service.sln --no-restore --verbosity normal

  npm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/chartis-pdf-viewer
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: packages/chartis-pdf-viewer/pnpm-lock.yaml

      - name: Install
        run: pnpm install

      - name: Build
        run: pnpm build