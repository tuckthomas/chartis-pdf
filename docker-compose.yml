services:
  chartis-api:
    build:
      context: ./dotnet
      dockerfile: Chartis.Pdf.Service/Chartis.Pdf.Api/Dockerfile
    ports:
      - "5200:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    volumes:
      - tessdata:/app/tessdata
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  tessdata: